name: Pack BD (pack-development backlog item)
description: File a pack-development backlog item against the pack repo.
title: "BD-NNN: <short title>"
labels:
  - work-item
  - needs-triage
  - template:work-item-v11.0
body:
  - type: markdown
    attributes:
      value: |
        Use this form to file a pack-development backlog item (BD-NNN) against
        the pack repo. The chat at triage time renames the title (e.g.
        `BD-NNN:` becomes the assigned ID), adds the entry-specific
        `template:` label, and resolves Blockers into first-class links.
  - type: dropdown
    id: wi-type
    attributes:
      label: Type
      description: Pack-development backlog item.
      options:
        - bd
    validations:
      required: true
  - type: dropdown
    id: wi-kind
    attributes:
      label: Kind
      description: Required. The METHODOLOGY § Part 7 type ("feat", "fix", "refactor", "docs", "chore", "infra").
      options:
        - feat
        - fix
        - refactor
        - docs
        - chore
        - infra
    validations:
      required: false
  - type: dropdown
    id: wi-status
    attributes:
      label: Initial status
      description: Defaults to Open. The chat changes status via labels post-creation.
      options:
        - Open
        - Unblocked
        - Pending
        - In Progress
        - Resolved
        - Done
        - Deferred
        - Cancelled
        - Deprecated
      default: 0
    validations:
      required: true
  - type: textarea
    id: wi-blockers
    attributes:
      label: Blockers
      description: |
        One per line. Each line is an issue id (BD-NNN, #N). The chat resolves these to first-class links/sub-issue parents post-creation.
    validations:
      required: false
  - type: textarea
    id: wi-unblocks
    attributes:
      label: Unblocks
      description: Informational; one issue id per line. Inverse of Blockers across the dataset.
    validations:
      required: false
  - type: input
    id: wi-file-symbol
    attributes:
      label: File / Symbol
      description: Affected path or symbol (free-form).
    validations:
      required: false
  - type: textarea
    id: wi-description
    attributes:
      label: Description
      description: Pack-development backlog item description.
    validations:
      required: false
  - type: textarea
    id: wi-context
    attributes:
      label: Context
      description: Background, motivation, related work.
    validations:
      required: false
  - type: textarea
    id: wi-resolution
    attributes:
      label: Resolution
      description: Filled when status flips to Resolved.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        <!-- pack-id: PENDING -->
        <!-- template_version: work-item-v11.0 -->
        <!-- pack-version: v11 -->
