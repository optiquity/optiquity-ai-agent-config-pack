# Pack structural validation + test runner. Runs on every push to any
# branch. Failures block merge to main. Fix immediately - read the
# Actions log; errors name the exact file and problem.
#
# Two jobs:
#   - validate: runs scripts/validate-pack.py (structural Checks)
#   - tests:    runs each enumerated scripts/tests/*-test.sh independently
#               (per-name list below — not a glob) so a failure in one suite
#               does not mask another's results.
#
# RELEASE-GATE wiring (BD-117 / BD-118): the `tests` job exercises the
# CI-eligible release-gate items so every push proves them. Specifically:
#   - Gate item 3 (BD-116 persona contracts) -> `persona contracts` step.
#   - Gate item 4 (BD-118 CI green) -> this workflow's overall status on
#     the candidate-tag SHA (no dedicated step; the workflow's own
#     pass/fail is the signal).
#   - Gate item 5 (`test-fixtures/build.sh --verify`) -> `fixture
#     manifest verify` step.
# Gate items 1 (per-version migrator framework adoption) and 2 (BD-114
# real-OT dry-run) are pre-tag manual checks - intentionally NOT in CI
# (item 2 touches a network-hosted real repo). See
# `maintenance-docs/v11-implementation/RELEASE-GATE.md`.
#
# Step ordering for the BD-115/116/117 surface (intentional):
#   (a)  build test fixtures              - rebuilds fixtures from scratch.
#                                           SIDE EFFECT: writes
#                                           `test-fixtures/manifest.txt` from
#                                           the freshly-built SHAs (via
#                                           `_update_manifest`). On the CI
#                                           runner this overwrites the
#                                           checked-out committed manifest.
#   (a2) restore committed manifest       - `git checkout HEAD -- ...` puts the
#                                           committed `manifest.txt` back so
#                                           step (b) compares against the
#                                           canonical pinned SHAs, not the
#                                           ones step (a) just wrote. Without
#                                           this, step (b) would be
#                                           tautological (BD-118 retro fix).
#   (b)  fixture manifest verify          - compares rebuilt fixture HEAD SHAs
#                                           vs the committed `manifest.txt`
#                                           (catches manifest drift /
#                                           non-determinism).
#   (c)  persona contracts                - runs against the verified fixtures.
# Failures attribute clearly: (a) = non-determinism in a builder;
# (b) = missing manifest update / fixture content drift; (c) = pack
# behavior regression surfaced by a contract.
#
# Step ordering invariant for the tests: job (BD-163)
# ===================================================
# Tests that depend on built fixtures (in test-fixtures/<name>/) MUST
# come AFTER the "build test fixtures" step. The fixtures are
# gitignored build artifacts; CI runners do not have them until built.
# Affected tests today:
#   - migrator-skills tests (BD-147) - depends on v10-realistic-ot
#                                      (G1 golden-snapshot regression)
#   - persona contracts (BD-116)     - depends on existing-project-mid-dev
#                                      and v10-realistic-ot via
#                                      `test-fixtures/build.sh
#                                      --for-contract <persona>`
#   - fixture manifest verify (BD-115) - depends on all built fixtures
# Each fixture-dependent test runner ALSO declares its precondition
# inline via the `require_fixture` helper (test-migrator-skills.sh)
# or via `_materialize_for_contract`'s built-fixture die-check
# (test-fixtures/build.sh, used by persona-contracts). CI step ordering
# is a defense-in-depth complement to those preconditions: the in-script
# checks give a clear local-dev error; the ordering keeps CI green even
# if a future runner forgets to call `require_fixture`.
#
# All test scripts run offline. tracker-provider / tracker-errors use
# PATH-prepended fake `gh` stubs (no live-network requirement).
#
# Security note: this workflow uses no untrusted input in run commands.
# Only runs local scripts against checked-out repo files.
#
# Branch protection: to enforce that failures block merge to main,
# configure in GitHub repo settings: Settings → Branches → Add rule →
# Branch name pattern: main → Require status checks to pass → select
# the "validate" and "tests" jobs. One-time repo admin action.

name: Validate Pack

on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run pack validation
        run: python3 scripts/validate-pack.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml

      # Per-suite steps - independent so one failure surfaces all.
      - name: detect.sh tests
        if: always()
        run: bash scripts/test-detect.sh
      - name: tracker-provider tests (BD-060, offline gh stubs)
        if: always()
        run: bash scripts/tests/tracker-provider-test.sh
      - name: tracker-config tests (BD-061)
        if: always()
        run: bash scripts/tests/tracker-config-test.sh
      - name: tracker-init tests
        if: always()
        run: bash scripts/tests/tracker-init-test.sh
      - name: tracker-agent-read tests
        if: always()
        run: bash scripts/tests/tracker-agent-read-test.sh
      - name: tracker-migrate forward tests (BD-065)
        if: always()
        run: bash scripts/tests/tracker-migrate-forward-test.sh
      - name: tracker-migrate reverse tests (BD-068)
        if: always()
        run: bash scripts/tests/tracker-migrate-reverse-test.sh
      - name: tracker-migrate roundtrip tests (BD-070)
        if: always()
        run: bash scripts/tests/tracker-migrate-roundtrip-test.sh
      - name: tracker phase-task tests (BD-106)
        if: always()
        run: bash scripts/tests/test-tracker-phase-task.sh
      - name: tracker links tests (BD-108)
        if: always()
        run: bash scripts/tests/test-tracker-links.sh
      - name: tracker cycle-check tests (BD-108)
        if: always()
        run: bash scripts/tests/test-tracker-cycle-check.sh
      - name: tracker error mapping tests (BD-066)
        if: always()
        run: bash scripts/tests/tracker-errors-test.sh
      - name: tracker-config-schema tests (BD-078, validate-pack Check 29)
        if: always()
        run: bash scripts/tests/tracker-config-schema-test.sh
      - name: recommendation-state-schema tests (BD-079, validate-pack Check 30)
        if: always()
        run: bash scripts/tests/recommendation-state-schema-test.sh
      - name: per-entry helper tests (BD-164)
        if: always()
        run: bash scripts/tests/test-per-entry.sh
      - name: validate-pack Check 32/33/34 tests (BD-168, per-entry split validators)
        if: always()
        run: bash scripts/tests/test-validate-pack-checks-32-33-34.sh
      - name: validate-pack Check 36/37/38 tests (BD-175 Commit 12, pack/project boundary)
        if: always()
        run: bash scripts/tests/test-validate-pack-checks-36-37-38.sh
      - name: validate-pack Check 39 tests (BD-175 F2a, install-coverage gate)
        if: always()
        run: bash scripts/tests/test-validate-pack-check-39.sh
      - name: validate-pack Check 40 tests (BD-179, pack-ops/ bare-cross-reference scanner)
        if: always()
        run: bash scripts/tests/test-validate-pack-check-40.sh
      - name: validate-pack Check 18 tests (BD-181, trinity H2 structure parity)
        if: always()
        run: bash scripts/tests/test-validate-pack-check-18.sh
      - name: validate-pack Check 16 tests (BD-183, trinity ## Project addenda H2 + Option (b) exemption)
        if: always()
        run: bash scripts/tests/test-validate-pack-check-16.sh
      - name: validate-pack Check 19 tests (BD-183, trinity templates free of body scaffolding)
        if: always()
        run: bash scripts/tests/test-validate-pack-check-19.sh
      - name: tracker BD-129 gh-repo routing tests (BD-129)
        if: always()
        run: bash scripts/tests/tracker-bd129-gh-repo-test.sh
      - name: tracker BD-130 doctor-wired tests (BD-130)
        if: always()
        run: bash scripts/tests/tracker-bd130-doctor-wired-test.sh
      - name: tracker BD-132 init-disable race tests (BD-132)
        if: always()
        run: bash scripts/tests/tracker-bd132-race-test.sh
      - name: tracker BD-133 header-preservation tests (BD-133)
        if: always()
        run: bash scripts/tests/tracker-bd133-header-preservation-test.sh
      - name: tracker BD-134 close-retry tests (BD-134)
        if: always()
        run: bash scripts/tests/tracker-bd134-close-retry-test.sh
      - name: recommendation tests (BD-072 / D-19)
        if: always()
        run: bash scripts/tests/recommendation-test.sh
      - name: pack-help tests (BD-075 / D-20)
        if: always()
        run: bash scripts/tests/pack-help-test.sh
      - name: customization-preserve tests (BD-088)
        if: always()
        run: bash scripts/tests/test-customization-preserve.sh
      - name: init-project tests (BD-080)
        if: always()
        run: bash scripts/tests/test-init-project.sh
      - name: migrate-v10-to-v11 tests (BD-085)
        if: always()
        run: bash scripts/tests/test-migrate-v10-to-v11.sh
      - name: migrate-v10-to-v11 dry-run/apply/resume tests (BD-095)
        if: always()
        run: bash scripts/tests/test-migrate-v10-to-v11-dry-run.sh
      - name: migrate-v10-to-v11 verification gates (BD-101)
        if: always()
        run: bash scripts/tests/test-migrate-v10-to-v11-gates.sh
      - name: migrate-v10-to-v11 decompose tests (BD-165)
        if: always()
        run: bash scripts/tests/test-migrate-v10-to-v11-decompose.sh
      - name: migrator-core tests (BD-119)
        if: always()
        run: bash scripts/test-migrator-core.sh
      - name: migrator-manifest tests (BD-119)
        if: always()
        run: bash scripts/test-migrator-manifest.sh
      - name: migrator-capability-translation tests (BD-144)
        if: always()
        run: bash scripts/test-migrator-capability-translation.sh
      - name: build test fixtures (BD-115/116/117)
        if: always()
        run: bash test-fixtures/build.sh --all --clean
      # BD-118 retro fix: `--all --clean` runs `_update_manifest`, which
      # overwrites the checked-out committed `test-fixtures/manifest.txt`
      # on the runner with the freshly-built SHAs. Without restoring the
      # committed manifest here, the next step (`--verify`) would compare
      # the just-built fixtures against the just-written manifest and
      # always pass by construction (tautological). Restoring HEAD's
      # version makes the verify step actually compare against the
      # canonical pinned SHAs. Read-only `git checkout -- <path>` form;
      # no branch state is mutated.
      - name: restore committed manifest before verify (BD-118 retro)
        if: always()
        run: git checkout HEAD -- test-fixtures/manifest.txt
      - name: fixture manifest verify (BD-115, RELEASE-GATE item 5)
        if: always()
        run: bash test-fixtures/build.sh --verify
      - name: v11-realistic-ot integration test (BD-160/170 + BD-164 + BD-168)
        if: always()
        run: bash scripts/tests/test-v11-realistic-ot.sh
      # BD-163: migrator-skills tests MUST run AFTER "build test fixtures"
      # because G1 (golden-snapshot regression) depends on the built
      # `test-fixtures/v10-realistic-ot/` fixture (gitignored build
      # artifact). The runner also calls `require_fixture` defensively.
      - name: migrator-skills tests (BD-147)
        if: always()
        run: bash scripts/test-migrator-skills.sh
      - name: persona contracts (BD-116, RELEASE-GATE item 3)
        if: always()
        run: bash scripts/test-persona-contracts.sh
      - name: template-translations tests
        if: always()
        run: bash scripts/tests/template-translations-test.sh
      - name: template-version tests
        if: always()
        run: bash scripts/tests/template-version-test.sh
      - name: issue-forms tests (BD-063)
        if: always()
        run: bash scripts/tests/test-issue-forms.sh
