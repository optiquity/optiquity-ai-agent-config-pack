# Pack structural validation + test runner. Runs on every push to any
# branch. Failures block merge to main. Fix immediately - read the
# Actions log; errors name the exact file and problem.
#
# Four jobs (BD-219 redesign: the `tests` job is a DYNAMIC sharded matrix):
#   - validate:     runs scripts/validate-pack.py (structural Checks) — full
#                   run, not sharded.
#   - plan:         a tiny job that emits the shard partition AT CI RUN TIME by
#                   running `scripts/lib/ci-shard-plan.py --emit-matrix` (an LPT
#                   bin-pack over the DISK-derived wired test set) into
#                   `$GITHUB_OUTPUT`. There is NO frozen `include` array and no
#                   refresh step — the matrix self-derives from disk every run.
#   - tests:        a DYNAMIC matrix derived from `plan`
#                   (`strategy.matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}`,
#                   4 shards) that partitions the wired test scripts across
#                   parallel runners (BD-219 lever 1 — cut CI wall-time). Each
#                   shard runs the tests in its `scripts` string via a run-loop;
#                   a failure in one test does not mask another's (rc accumulates
#                   per shard; `fail-fast: false` keeps other shards running).
#                   Adding a test requires only committing the test file — it is
#                   auto-discovered and sharded on the next push (no manual
#                   wiring step).
#   - tests-result: aggregates the matrix into one signal (`needs: [plan, tests]`)
#                   and re-asserts shard-coverage at run time (--assert-coverage).
#
# RELEASE-GATE wiring (BD-117 / BD-118): the `tests` job exercises the
# CI-eligible release-gate items so every push proves them. Specifically:
#   - Gate item 3 (BD-116 persona contracts) -> `persona contracts` step.
#   - Gate item 4 (BD-118 CI green) -> this workflow's overall status on
#     the candidate-tag SHA (no dedicated step; the workflow's own
#     pass/fail is the signal).
#   - Gate item 5 (`test-fixtures/build.sh --verify`) -> `fixture
#     manifest verify` step.
# Gate items 1 (per-version migrator framework adoption) and 2 (BD-114
# real-target-app dry-run) are pre-tag manual checks - intentionally NOT in CI
# (item 2 touches a network-hosted real repo). See
# `maintenance-docs/v11-implementation/RELEASE-GATE.md`.
#
# Step ordering for the BD-115/116/117 surface (intentional):
#   (a)  build test fixtures              - rebuilds fixtures from scratch.
#                                           SIDE EFFECT: writes
#                                           `test-fixtures/manifest.txt` from
#                                           the freshly-built SHAs (via
#                                           `_update_manifest`). On the CI
#                                           runner this overwrites the
#                                           checked-out committed manifest.
#   (a2) restore committed manifest       - `git checkout HEAD -- ...` puts the
#                                           committed `manifest.txt` back so
#                                           step (b) compares against the
#                                           canonical pinned SHAs, not the
#                                           ones step (a) just wrote. Without
#                                           this, step (b) would be
#                                           tautological (BD-118 retro fix).
#   (b)  fixture manifest verify          - compares rebuilt fixture HEAD SHAs
#                                           vs the committed `manifest.txt`
#                                           (catches manifest drift /
#                                           non-determinism).
#   (c)  persona contracts                - runs against the verified fixtures.
# Failures attribute clearly: (a) = non-determinism in a builder;
# (b) = missing manifest update / fixture content drift; (c) = pack
# behavior regression surfaced by a contract.
#
# Step ordering invariant for the tests: job (BD-163, BD-219 redesign)
# ===================================================================
# Tests that depend on built fixtures (in test-fixtures/<name>/) MUST
# run AFTER the fixtures are built. The fixtures are gitignored build
# artifacts; CI runners do not have them until built. Under BD-219's
# sharded matrix this invariant is held by LOCATION-based fixture
# cohesion: fixture-dependent tests live under
# `scripts/tests/fixture-dependent/`, and ci-shard-plan.py pins
# everything in that subdir into ONE shard. Only that shard runs the
# conditional "build test fixtures" step (gated by
# `--shard N --needs-fixtures`) before its run-loop. The current
# members (auto-derived from that subdir):
#   - test-v11-realistic-ot.sh   - built fixtures (BD-160/170 + per-entry)
#   - test-migrator-skills.sh    - v10-realistic-ot (G1 golden snapshot)
#   - test-persona-contracts.sh  - existing-project-mid-dev + v10-realistic-ot
#   - test-dry-run-migration.sh  - v10-realistic-ot
#   - test-add-capability.sh     - v11-flat-file
# Each fixture-dependent test runner ALSO declares its precondition
# inline via the `require_fixture` helper (test-migrator-skills.sh)
# or via `_materialize_for_contract`'s built-fixture die-check
# (test-fixtures/build.sh, used by persona-contracts). The shard
# co-location is a defense-in-depth complement to those preconditions:
# the in-script checks give a clear local-dev error; the location-based
# pinning keeps CI green by guaranteeing the build step runs in the same
# shard, before, those tests.
#
# All test scripts run offline. tracker-provider / tracker-errors use
# PATH-prepended fake `gh` stubs (no live-network requirement).
#
# Security note: this workflow uses no untrusted input in run commands.
# Only runs local scripts against checked-out repo files.
#
# Branch protection: to enforce that failures block merge to main,
# configure in GitHub repo settings: Settings → Branches → Add rule →
# Branch name pattern: main → Require status checks to pass → select
# the "validate" and "tests-result" jobs (tests-result aggregates every
# matrix shard into one signal). One-time repo admin action.

name: Validate Pack

on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run pack validation
        run: python3 scripts/validate-pack.py
      # BD-204 C-4.6 (SHOULD-1, deep home #2): the field-faithfulness deep
      # guard (Check 49) is ENV-GATED — it SKIPs on the general step above
      # and runs ONCE here on the real `/backlog/` per push, driving the
      # shared batch codec (Option B). The general step stays env-UNSET so
      # the 151× battery path pays ~0 (§4.6 (P)).
      - name: Run pack validation (DEEP field-faithfulness, BD-204 §4.6)
        run: PACK_VALIDATE_DEEP=1 python3 scripts/validate-pack.py

  # BD-219 redesign: the `plan` job emits the DYNAMIC shard partition at CI run
  # time. `ci-shard-plan.py --emit-matrix` LPT-bin-packs the DISK-derived wired
  # KEEP set ({scripts/test*.sh + scripts/tests/*.sh
  # + scripts/tests/fixture-dependent/*.sh} − allowlist) over
  # scripts/ci-shard-weights.tsv and prints the single-line matrix JSON, which
  # this job captures into $GITHUB_OUTPUT for the `tests` job to consume via
  # `fromJSON`. There is NO frozen `include` array and no refresh step — the
  # matrix self-derives from disk every run. The module is stdlib-only (no
  # pyyaml needed here). The wired set has ONE source (disk); Check 42 +
  # `--assert-coverage` re-prove coverage.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: plan
        run: echo "matrix=$(python3 scripts/lib/ci-shard-plan.py --emit-matrix)" >> "$GITHUB_OUTPUT"

  # BD-219 redesign: the `tests` job is a DYNAMIC sharded MATRIX. The wired KEEP
  # test set is partitioned into 4 parallel shards (BD-219 lever 1: cut CI
  # wall-time). The partition comes from the `plan` job at run time:
  #   strategy.matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
  # `fromJSON` of `{"include":[{"shard":N,"scripts":"..."}]}` yields the GA
  # dynamic-matrix shape (matrix.shard + matrix.scripts resolve per combination).
  # The wired set has ONE source — disk — read identically by:
  #   - scripts/lib/ci-shard-plan.py parse_wired_tests()  (drives --emit-matrix)
  #   - scripts/validate-pack.py Check 42 (allowlist validity + partitionability)
  #     + Check 60 (--assert-coverage mirror)
  # Adding a test requires only committing the test file in the right place
  # (scripts/tests/ for a normal test; scripts/tests/fixture-dependent/ for a
  # fixture-dependent test) — it is auto-discovered, sharded, and (if fixture-
  # dependent) auto-pinned into the fixture-building shard on the next push.
  # There is no static array to paste and nothing to keep in sync.
  tests:
    needs: [plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml

      # ── BD-219 §2.5: build fixtures ONLY in the shard that owns the fixture
      # cohesion set (ci-shard-plan.py pins everything under
      # scripts/tests/fixture-dependent/ into one shard — location-based
      # cohesion). `--shard N --needs-fixtures` exits 0 iff this shard owns a
      # fixture-dependent test. The BD-115/116/117 build + BD-118
      # manifest-restore + BD-115 verify ORDER is preserved (steps a/a2/b of the
      # header comment), run once in the fixture-owning shard.
      - name: build test fixtures (only if this shard needs them)
        if: always()
        run: |
          if python3 scripts/lib/ci-shard-plan.py --shard ${{ matrix.shard }} --needs-fixtures; then
            bash test-fixtures/build.sh --all --clean
            git checkout HEAD -- test-fixtures/manifest.txt   # BD-118 retro: restore committed manifest before --verify (read-only path checkout; no branch state)
            bash test-fixtures/build.sh --verify
          fi

      # ── BD-219 §2.4: run every test in this shard's `scripts` string. Each
      # test runs once; the shard exits non-zero on ANY failure (rc accumulates)
      # so a failure surfaces without masking the others. `fail-fast: false`
      # (above) keeps the other shards running.
      - name: run shard ${{ matrix.shard }}
        if: always()
        run: |
          rc=0
          for t in ${{ matrix.scripts }}; do
            echo "::group::$t"
            bash "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # BD-219 redesign: single aggregated signal for the sharded `tests` matrix.
  # `needs: [plan, tests]` succeeds only if EVERY shard succeeded; the second
  # step re-proves at run time that the disk-derived partition covers the wired
  # KEEP set exactly (catches any drift between disk, the emitted matrix, and the
  # shards). This is the AUTHORITATIVE run-time coverage assertion (Check 60 is
  # the convenience validate-pack mirror).
  tests-result:
    needs: [plan, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: assert all shards succeeded
        run: test "${{ needs.tests.result }}" = "success"
      - name: assert shard partition covers the wired set exactly
        run: python3 scripts/lib/ci-shard-plan.py --assert-coverage
