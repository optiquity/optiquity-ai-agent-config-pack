# buf.gen.yaml — Code generation for Python grpc.aio
# https://buf.build/docs/configuration/v2/buf-gen-yaml
#
# Prerequisites: grpcio-tools must be installed in the active Python environment.
#   uv add grpcio-tools
#
# Run: scripts/proto-gen.sh
version: v2
plugins:
  # Protobuf message types (Python)
  - remote: buf.build/protocolbuffers/python
    out: ../server/src/generated

  # gRPC service stubs (Python — works with grpc.aio)
  - remote: buf.build/grpc/python
    out: ../server/src/generated

  # Type stubs for pyright/mypy
  - remote: buf.build/protocolbuffers/pyi
    out: ../server/src/generated
