profile = "cloud-default"
model = "gpt-5"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search_mode = "on"
oss_provider = "lmstudio"
developer_instructions = """
All major work categories are allowed in this repository: planning, architecture, implementation, refactoring, debugging, testing, review, dependency review, repo operations, and documentation.
No task category is reserved exclusively for another tool.
Prefer a stronger cloud model for correctness-sensitive work.
Use local models only where the verification path is strong and the likely result is equivalent.
This repo is Python-server-first and should remain cross-platform.
"""

[sandbox_workspace_write]
network_access = true
writable_roots = ["."]

[profiles.cloud-default]
model = "gpt-5"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search_mode = "on"

[profiles.local-light]
model = "gpt-oss:20b"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search_mode = "off"

[profiles.local-code]
model = "qwen3-coder-30b-a3b-instruct-8bit"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search_mode = "off"

[model_providers.ollama]
name = "Ollama"
base_url = "http://localhost:11434/v1"
env_key = "OLLAMA_API_KEY"

[model_providers.lmstudio]
name = "LM Studio"
base_url = "http://localhost:1234/v1"
env_key = "LMSTUDIO_API_KEY"

[agents]
max_threads = 6
max_depth = 1

[agents.planner]
description = "Planning specialist for scoping work, sequencing changes, and defining verification steps before non-trivial edits."
config_file = "agents/planner.toml"

[agents.coder]
description = "Implementation specialist for targeted code changes, refactors, and test updates."
config_file = "agents/coder.toml"

[agents.reviewer]
description = "Read-only reviewer focused on correctness, regressions, API boundaries, and missing tests."
config_file = "agents/reviewer.toml"

[agents.tester]
description = "Read-only test strategist for unit, integration, API, and end-to-end verification."
config_file = "agents/tester.toml"

[agents.repo_ops]
description = "Repository operations specialist for scripts, command sequencing, and Git-safe automation."
config_file = "agents/repo-ops.toml"

[agents.docs_researcher]
description = "Read-only documentation specialist for verifying APIs, options, and config behavior from official docs."
config_file = "agents/docs-researcher.toml"

[agents.grpc_schema]
description = "Read-only Proto3 schema specialist for field evolution, breaking-change detection, buf validation, and gRPC service contract review."
config_file = "agents/grpc-schema.toml"
