[project]
name = "apple-app-python-server"
version = "0.1.0"
description = "Combined Apple app and Python server repository template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyright>=1.1.0",
  "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["server/tests"]
