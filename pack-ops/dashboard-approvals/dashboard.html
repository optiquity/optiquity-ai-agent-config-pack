 --bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--surface-3:#e6eaf1;--line:#dbe1ea;

html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:flex;min-height:100vh;background:var(--bg)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
aside{width:248px;min-width:248px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);margin-bottom:2px}
.brand .v{display:block;font-size:.72rem;color:var(--ink-mid);font-weight:500;margin-top:2px}
.navgroup{margin-top:18px}

.navgroup a{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;color:var(--ink-mid);font-size:.86rem}
.navgroup a:hover{background:var(--surface-2);text-decoration:none}
.navgroup a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--pending)}
.dot.done{background:var(--done)}.dot.active{background:var(--active)}.dot.pending{background:var(--pending)}

main{flex:1;max-width:900px;margin:0 auto;padding:30px 34px 80px}

h1{font-size:1.9rem;margin:.1em 0 .3em}
h2{font-size:1.15rem;margin:1.6em 0 .5em}
.lede{color:var(--ink-mid);margin:0 0 4px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
.tile .v{font-size:1.5rem;font-weight:700;margin-top:3px}
.tile .s{font-size:.76rem;color:var(--ink-mid)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:.9rem}
.kv .k{color:var(--ink-mid)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.active{background:var(--active-soft);color:var(--active)}
.pill.pending{background:var(--pending-soft);color:var(--ink-mid)}
.pill.unblocked{background:var(--pending-soft);color:var(--pending)}
.pill.blocker{background:var(--blocker-soft);color:var(--blocker)}
.pill.neutral{background:var(--pending-soft);color:var(--ink-faint)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.gate{background:var(--gate-soft);color:var(--gate)}
.chip{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.68rem;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);margin-left:5px}
.chip.gate{background:var(--gate-soft);color:var(--gate)}
.chip.here{background:var(--active-soft);color:var(--active)}
.chip.fresh{background:var(--done-soft);color:var(--done)}
.chip.behind{background:var(--surface-3);color:var(--ink-mid)}
.chip.live{background:var(--active-soft);color:var(--active)}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .idx{color:var(--ink-faint);font-variant-numeric:tabular-nums;min-width:22px}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600}
.row .note{color:var(--ink-mid);font-size:.83rem}
.bar{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--done)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em}
.muted{color:var(--ink-mid)}.faint{color:var(--ink-faint)}
.disc{font-size:.76rem;color:var(--ink-faint);border-top:1px solid var(--line);margin-top:22px;padding-top:10px}
.filter{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin:8px 0 4px}
.proj{border:2px dashed var(--gate);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.proj h3{margin:0 0 6px;color:var(--gate)}
.step{display:flex;gap:9px;align-items:baseline;padding:4px 0}
.box{display:inline-flex;width:16px;height:16px;border:1.5px solid var(--ink-faint);border-radius:4px;align-items:center;justify-content:center;font-size:.7rem;flex:none}
.box.done{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.sec{margin-top:14px}
.menu-btn{display:none}
#scrim{display:none}
@media(max-width:760px){
 aside{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
 body.nav-open aside{transform:none}

 main{padding:16px 16px 60px}
 .menu-btn{display:inline-flex;position:sticky;top:8px;z-index:20;margin-bottom:8px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
 .kv{grid-template-columns:1fr}
}
</style></head>

wer` directly. Pack Chat handles BACKLOG/CHANGELOG entries, routing, approvals, commits, and user-facing decisions.","group":"Workflow","title":"Pack Chat does not architect."},{"anchor":"one-review-fix-cycle-per-batch","body":"Run `pack-reviewer` once per batch, fix once, move on. Do not propose a second review pass; the final audit is user-initiated. Fixes land in the current session. New-BD-opens follow the OQ-1 rule per EXECUTION-PLAN \u00a7B step 5 + W8 \"Deferral IS scope creep\" (size/blocked/fit + user-discussion-and-approval).","group":"Workflow","title":"One review/fix cycle per batch."},{"anchor":"implicit-bd-status-flip-on-batch-completion","body":"When a batch's review + fixes are clean and tests are green, flip its BDs to `Resolved` as the final step of the batch \u2014 no separate user approval needed.","group":"Workflow","title":"Implicit BD status flip on batch completion."},{"anchor":"per-action-approval-sub-agents","body":"Every sub-agent obeys the same \"no state-changing operation without explicit per-action approval\" rule its parent obeys \u2014 never run a destructive file operation on your own authority even when the task is approved: `rm`/`rm -rf`/`rmdir`/`unlink`/`git rm`/ `find \u2026 -delete`/`find \u2026 | xargs rm`/`mv \u003csrc>`/`shred`/`truncate`. Each spawned agent OWNS one unique work dir (its assigned handoff/scratch dir) and writes ALL output there. **An agent deletes or destructively overwrites NOTHING outside its owned dir and the OS temp roots (`$TMPDIR`/mktemp)** \u2014 never another agent's dir, a shared scratch ro","group":"Workflow","title":"Per-action approval extends to sub-agents; scratch is owned + write-mostly."},{"anchor":"deferred-work-tracked-anchor","body":"When work is genuinely deferred (user-authorized; survives the `feedback-deferral-is-scope- creep` size/blocked/fit test), it MUST land on a live forward-pointing surface AND be scheduled to a specific anchor: an open BD entry, a live `// TODO(scope): TD-TBD` comment in code per `project-template/ CLAUDE.md` \u00a7 \"Deferral comments and BACKLOG hygiene\", or a new BD inserted at the appropriate plan position. ` `","group":"Workflow","title":"Deferred work needs a tracked anchor."},{"anchor":"no-deferral-without-user-direction","body":"While v11.0 is unlaunched, ALL work surfaced during v11.0 development MUST land in v11.0 unless the user explicitly authorizes deferral; treat any architect/reviewer/coder defer-recommendation as a SCOPING signal, not an AUTHORITY signal \u2014 re-scope to land in v11.0 and surface the blast-radius. ` `","group":"Workflow","title":"No deferral to v11.1+ without explicit user direction."},{"anchor":"deferral-is-scope-creep","body":"Treat deferring unblocked work to a later BD or batch as tech debt \u2014 defend any deferral only with (a) SIZE, (b) BLOCKED, or (c) LOGICAL FIT (concrete file/contract evidence, not \"felt big\"/\"feels related\"/\"thematic\"), else do the work now. ` `","group":"Workflow","title":"Deferral IS scope creep."},{"anchor":"per-bd-review-fix-runs-inline-before-next-bd-s-c","body":"Multi-BD batches: each BD's review/fix runs inline (coder \u2192 reviewer \u2192 triage \u2192 fix-coder \u2192 commit \u2192 NEXT BD's coder). End-of-batch reviewer runs once on the full batch after all per-BD cycles complete. Single-BD batches: only one cycle needed. Never delay per-BD reviews to end-of-batch retroactive recovery.","group":"Workflow","title":"Per-BD review/fix runs INLINE, before next BD's coder spawns."},{"anchor":"pack-chat-presents-triage-to-user-before-fix-cod","body":"After every reviewer pass, Pack Chat reads the report, triages each finding (FIX vs SKIP, with rationale for SKIPs \u2014 default FIX-ALL per `feedback-fix-all-review-findings`), and surfaces the triage to the user. User can override per finding before fix-coder spawns. User approves the resulting fix commit, not per-finding. The triage gate is between reviewer and fix-coder; the commit gate is between fix-coder IMPL-REPORT and the `git commit`.","group":"Workflow","title":"Pack Chat presents triage to user before fix-coder spawns."},{"anchor":"triage-all-reviewer-findings-default-fix-all-nit","body":"Pack Chat surfaces every reviewer finding (BLOCKER / MUST / SHOULD / NIT) to the user as a fix-or-defer triage per finding. The default for all severities is FIX. NITs that are deferred (with user-discussion-and-approval per OQ-1 EXECUTION-PLAN \u00a7B) become tracked tech debt \u2014 never \"noted in the report and dropped.\" Default fix-all preserves the small-fix-now contract that prevents tech debt accumulation. See `feedback-deferred-work-tracking` and `feedback-deferral-is-scope-creep` for the memory-cache pointers.","group":"Workflow","title":"Triage all reviewer findings; default fix-all; nits become tech debt."},{"anchor":"boundary-investigation-precedes-pack-defaults","body":"Before changing ANY project-side file (`project-template/` trees, project-shipped content), investigate whether a project-side SSOT exists for the concept and use it \u2014 never reach for a pack-style mechanism (`pack-ops/` files, Pack Chat orchestrator role, pack-* agent names, `maintenance-docs/` records) by default, since those are PACK-ONLY and importing them is a client-install regression. ` `","group":"Workflow","title":"P-missed-7 \u2014 project-side investigation precedes pack-style defaults."},{"anchor":"pack-agent-invocation","body":"Pack agents are invoked via `claude --agent pack-\u003cname>` (separate session) or via the Agent tool with `subagent_type=pack-\u003cname>` (sub-agent within Pack Chat). The pack repo has no `agent-run.sh` \u2014 that's a project template helper, not a pack invocation method.","group":"Agent invocation rules","title":"Pack agent invocation."},{"anchor":"inject-the-graph-path-into-every-spawn-prompt-cl","body":"Under worktree isolation a spawned agent's `$(git rev-parse --show-toplevel)` resolves to the empty worktree root where gitignored `graphify-out/` is absent, so the orchestrator MUST derive the real graph path AT RUNTIME in its canonical checkout (the derivation formula `$(git rev-parse --show-toplevel)/graphify-out/graph.json`) and INJECT the resulting absolute literal into every spawn prompt \u2014 only when that canonical `graphify-out/graph.json` exists (else inject no path). The agent queries with `graphify \u003cverb> \u2026 --graph \u003cinjected>`, NEVER its own toplevel. See \u00a7 \"Graph-first context\" for t","group":"Agent invocation rules","title":"Inject the graph path into every spawn prompt (Claude-only)."},{"anchor":"agent-prompt-requirements","body":"Every agent prompt must include: context (what the codebase is, what the task is), output file path, read-only flags where applicable, markdown-only directive for outputs, problem / goal / success criteria, and an instruction to chunk Write calls for outputs over ~300 lines.","group":"Agent invocation rules","title":"Agent prompt requirements."},{"anchor":"no-solutions-in-agent-prompts","body":"Agent prompts contain only problem, goal, and success criteria. No proposed solutions, no \"pick one\" options, no biased framing. Architects/planners/coders/reviewers reach their own conclusions.","group":"Agent invocation rules","title":"No solutions in agent prompts."},{"anchor":"no-prior-reviews-to-pack-reviewer","body":"Reviewer prompts reference ARCHITECTURE / PLAN docs only \u2014 never prior `PACK-REVIEW-*.md` reports. Including a prior review biases the new review.","group":"Agent invocation rules","title":"No prior reviews to pack-reviewer."},{"anchor":"reconciliation-instance-independence","body":"A reconciliation pass (the round resolving an adversarial review's findings before the work advances) uses a FRESH, independent instance \u2014 NEVER the original author (contaminated + design-biased toward its own design) NOR the adversarial reviewer (biased toward its own findings). Applies to EVERY role \u2014 architect, planner, coder, reviewer, auditor, repo-ops, tester, grpc-schema, any other \u2014 with ONE exception: `docs-researcher`, which MAY be re-engaged/reused (factual inventory; accumulated context helps; no design bias). Two carve-outs override the default: (1) **user override** \u2014 the user EX","group":"Agent invocation rules","title":"Reconciliation-instance independence."},{"anchor":"researcher-first-pipeline-for-substantive-conten","body":"When agent work depends on domain knowledge verified against authoritative external sources (CLI docs, tool semantics, framework behavior), the pipeline is `pack-docs-researcher` \u2192 `pack-architect` \u2192 `pack-planner` \u2192 `pack-coder`. Architect runs AFTER researcher, not before, not skipped. The same-architect-vs-fresh-architect decision for the second architect pass is per-case user discussion at the second-pass decision point.","group":"Agent invocation rules","title":"Researcher-first pipeline for substantive content."},{"anchor":"large-bd-pipeline-standard","body":"Pack-side BD development runs ONE official pipeline; the size test picks WHICH flow (deterministic, never a choice). A LARGE BD runs the DETERMINISTIC flow \u2014 every stage mandatory except reconciliation, which runs ONLY when the preceding adversarial pass returned findings (no findings \u21d2 nothing to reconcile, a consequence not a choice): docs-researcher (ALWAYS first; internal census always, external-docs per-need) \u2192 architect \u2192 adversarial architect \u2192 reconciliation architect (if findings) \u2192 user design review \u2192 planner \u2192 adversarial planner \u2192 reconciliation planner (if findings) \u2192 user planne","group":"Agent invocation rules","title":"Large-BD pipeline standard (size-tiered)."},{"anchor":"cross-bd-collision-scan","body":"At the architect stage, after the researcher produces the blast-radius set, the architect MUST intersect THIS BD's set with every open BD's blast-radius / structured-surface set and record collision-or-none in an Empirical-Evidence Block. It keys on the structured BLAST-RADIUS paths, NOT the free-text `File/Symbol` line (a TBD/prose field has zero recall); covers the pack AND project backlogs; a non-empty intersection is a COORDINATE signal (sequence the two co-editing BDs), not a gate. ` `","group":"Agent invocation rules","title":"Cross-BD design-time collision scan."},{"anchor":"planner-output-user-review-coder-spawn","body":"Pack-planner output is NEVER auto-approved into a pack-coder spawn. Pack Chat surfaces the plan to the user for thorough review (the user may comment, add constraints, request structural changes) and waits for explicit approval before spawning pack-coder. The planner-to-coder gate is the user's last cheap window to redirect work before implementation consumes hours of agent time and chat context.","group":"Agent invocation rules","title":"Planner output \u2192 user review \u2192 coder spawn."},{"anchor":"preflight-stop-means-stop","body":"Before writing your IMPL-REPORT, emit ONE plain line `PREFLIGHT: N/N in-scope edits complete; verification PASS; HEAD \u003cSHA>; about to Write IMPL-REPORT to \u003cpath>` only after all edits + verification (in-scope tests + `validate-pack.py` Check 43 + any relevant per-check tests) PASS \u2014 if any failed, report what went wrong INSTEAD of a partial IMPL-REPORT; and at ANY point, a parent message saying stop/halt/revert/do-not-continue halts ALL work immediately (partial files OK; never append to \"make consistent\"). ` `","group":"Agent invocation rules","title":"Pack-coder PREFLIGHT + STOP-MEANS-STOP pattern."},{"anchor":"enumerate-rules-inline","body":"Every sub-agent prompt Pack Chat constructs MUST enumerate ALL applicable pack-memory rules + trinity sections INLINE as literal rule text (name + Why + How-to-apply), never by reference or hyperlink \u2014 before spawning ANY sub-agent, assemble a \"Rules in force\" block selecting the rules tagged for the spawn's role plus the universal rules. Pack Chat NEVER spawns an agent without the rules-in-force block. ` `","group":"Agent invocation rules","title":"Agent prompt enumerates ALL applicable rules inline."},{"anchor":"rules-applied-verification-block","body":"Every sub-agent output (architect design doc / planner plan / coder IMPL-REPORT / reviewer report / fix-coder report / docs-researcher report) MUST end with a **Rules-Applied Verification Block**. For each rule listed in the prompt's \"Rules in force\" block, the agent records: (a) **Rule name** as named in MEMORY.md; (b) **Verification evidence** \u2014 the actual measurement (grep output, file path, count, diff, command result), quoted not summarized; (c) **Conclusion** \u2014 `COMPLIANT` / `N/A: \u003creason>` / `VIOLATED: \u003creason>` (empty evidence is treated as VIOLATED; AMBIGUOUS is not an allowed termina","group":"Agent invocation rules","title":"Agent output requires Rules-Applied Verification Block."},{"anchor":"empirical-evidence-blocks","body":"Every architect-design or planner-plan output MUST embed an **Empirical-Evidence Block** for every state-claim. A state- claim is any assertion about repo state or downstream state \u2014 e.g., \"the tree has X,\" \"the tree has NO X,\" \"after step N the tree will contain Y,\" \"the allowlist covers all legitimate references.\" Each state-claim is backed by: the actual command run; the actual output captured (count, paths, lines \u2014 not paraphrased); the date / HEAD-SHA at which the measurement was taken; the interpretation; a conclusion (SUPPORTED / NOT-SUPPORTED / PARTIAL with reason). ` `","group":"Agent invocation rules","title":"Architect/planner state-claims require Empirical-Evidence Blocks."},{"anchor":"ci-guard-measure-then-bound","body":"When an architect designs a CI guard, validator, allowlist, or any check that will run against the repo at PR-time or CI-time, the architect MUST follow this contract: (1) **Measure first** \u2014 run the guard's matching logic against the actual current repo state; capture the complete list of occurrences; (2) **Categorize every occurrence** as KEEP (legitimate \u2192 allowlist) or STRIP (contamination \u2192 fix-recipe); (3) **Design fix-recipes** that strip every STRIP- classified occurrence; (4) **Size the allowlist exactly to the legitimate-set** \u2014 no broader; (5) **Verify post-design** the guard runs c","group":"Agent invocation rules","title":"CI guard design \u2014 measure-then-bound."},{"anchor":"spawn-unique-naming","body":"Every spawned agent carries a unique, descriptive `name` of the shape `\u003crole>-\u003cbd>-\u003cfacet>[-\u003cseq>]` (lowercase kebab, `^[a-z0-9][a-z0-9-]{2,47}$`): `\u003crole>` the agent role token (`coder`/`fixcoder`/`reviewer`/`architect`/`planner`/`docsresearcher` \u2014 the `subagent_type` minus the `pack-` prefix); `\u003cbd>` the work anchor (`bdNNN` or `batchNN`); `\u003cfacet>` a short scope tag (`cdocs`/`worktree`/`external`); append `-2`/`-3`\u2026 to keep a repeated `\u003crole>-\u003cbd>-\u003cfacet>` triple unique within a live cycle (uniqueness is a DISCIPLINE \u2014 no platform guarantees it). In Claude Code the `name` is the Agent-tool ","group":"Agent invocation rules","title":"Uniquely + descriptively name every spawn."},{"anchor":"edit-in-place-not-full-rewrite","body":"Agents edit docs/files via targeted in-place edits; a full rewrite happens only on explicit user request; after any edit re-read and confirm the section map. ` `","group":"Agent invocation rules","title":"Edit in place, not full rewrites."},{"anchor":"design-discipline-challenge","body":"Adopting a structural pattern for a new use-case requires verified property-fit (intentional, evidence-based, goal-aligned, constraint-bounded \u2014 never pattern-match out of context); every triage decision is PRELIMINARY and the architect challenges each at design time on a tiered bar (internal LOW / pack-boundary HIGH / user-goals HIGH-but-challengeable). ` `","group":"Agent invocation rules","title":"Design-time challenge discipline."},{"anchor":"verify-availability-not-existence","body":"When a design depends on an external capability, verify it is USABLE on the actual target (account type / plan / GA-vs-preview / installed variant), not merely that it EXISTS; capture the availability check as evidence. ` `","group":"Agent invocation rules","title":"Verify availability, not just existence."},{"anchor":"verify-full-ci-suite","body":"Per-commit verification (coder + reviewer) runs every wired test in the validate workflow (both jobs) plus PACK_VALIDATE_DEEP=1, not validate-pack alone; enumerate-encoding-surfaces includes the integration tests. ` `","group":"Agent invocation rules","title":"Verify the full CI battery, not just validate-pack."},{"anchor":"open-item-surfacing","body":"Every spawned agent MUST surface each open item (question / gap / expansion / decision) with (1) enough context to understand the problem, (2) the agent's OWN options, and (3) an evidence-or-logic-based recommendation \u2014 OR an explicit \"no recommendation can be given.\" A recommendation that relies on memory, or that defers or delays the work to another or a new BD, is EXCLUDED. ` `","group":"Agent invocation rules","title":"Surface every open item with context, options, and a recommendation."},{"anchor":"sub-agent-isolation-is-keyed-by-agent-class-rw-i","body":"- **RW class.** Read-WRITE sub-agents (coders, fix-coders \u2014 anything that mutates) run in an ISOLATED worktree. The FIRST coder of a commit CREATES it (per-spawn Agent-tool `isolation:\"worktree\"` \u2014 the TRIGGER, the only valid value); every subsequent RW agent in that cycle \u2014 fix-coders included \u2014 REUSES that worktree, NEVER a new one. - **RO class.** Read-ONLY sub-agents (reviewers, architects, planners, auditors, docs-researchers) run in the tree the work lives in: the main checkout when committed/on HEAD; the commit's live worktree when still uncommitted there (cd in + verify pwd/HEAD). RO i","group":"Sub-agent behavior (Claude-only)","title":"Sub-agent isolation is keyed by agent class (RW \u2192 isolated worktree; RO \u2192 the work's tree)."},{"anchor":"default-sub-agent-spawns-to-background","body":"Every Agent-tool invocation from Pack Chat uses `run_in_background: true` so the chat stays interactive while the sub runs. User has auto-mode on; the background sub will not block the chat. Trinity exemption: this rule references the Claude Code Agent tool's `run_in_background` parameter; Codex parallel-spawn behavior is implicit (parallel-by-default, capped by `agents.max_threads`); Antigravity parallel-spawn is implicit via its dynamic-subagent mechanism (the `define_subagent` / plugin-roster subagent invocation; preview). No cross-CLI parity edit needed \u2014 each platform's parallel-or-async ","group":"Sub-agent behavior (Claude-only)","title":"Default sub-agent spawns to background."},{"anchor":"agent-team-stage-lifecycle-per-commit-fresh-code","body":"With `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1` enabled, sub-agents spawned for a stage (architect \u2192 planner \u2192 coder \u2192 reviewer) stay alive within the stage; Pack Chat uses SendMessage for follow-ups against the same instance \u2014 including the sanctioned rule-4 post-review-clean patch step (SendMessage-ing the most-recent read-write agent to produce its `git diff` patch only after the review is clean). After the stage's commit lands, close ALL stage sub-agents and respawn fresh for the next stage. Additionally: each pack-coder commit gets a FRESH coder instance \u2014 never reuse a coder across commits","group":"Sub-agent behavior (Claude-only)","title":"Agent-team stage lifecycle + per-commit fresh-coder."},{"anchor":"spawn-unique-naming","body":"The orchestrator records each Agent-tool spawn \u2014 its unique `name` (see `### Agent invocation rules` ``), `agentId` (from the spawn tool_result), `purpose`, `status` \u2014 into the gitignored per-clone ledger `graphify-out/.pack-spawn-registry.jsonl` (NEVER committed \u2014 `agents-never-commit`; modeled on `graphify-out/.pack-refresh-status`) and CONSULTS it to re-find a still-alive spawn with NO transcript archaeology (re-read from disk, so it survives a parent context compaction). Lookup precedence: **by NAME \u2192 by agentId** (both work as `SendMessage.to`, measured; there is NO message-id addressing ","group":"Sub-agent behavior (Claude-only)","title":"Record every spawn in the durable registry; re-find by name\u2192agentId (Claude-only mechanism)."},{"anchor":"trinity-exemption","body":"This sub-section is Claude-specific (not mirrored in `AGENTS.md` / `GEMINI.md`) because its rules are built against Claude Code's Agent-tool mechanism \u2014 the Agent tool's spawn schema, the `run_in_background` parameter (Codex/Antigravity async spawning is implicit/platform-native, not a named parameter), and the Agent Teams / SendMessage peer-messaging primitives. Codex MAv2 `send_message` (flag-gated `multi_agent_v2`; issue #12462 CLOSED-COMPLETED) and Antigravity `agy` (inter-agent ID-addressing + idle auto-rewake) now ship peer-messaging ANALOGS, but they are flag-gated / not-yet-GA-document","group":"Sub-agent behavior (Claude-only)","title":"Trinity exemption."},{"anchor":"pack-chat-does-no-fixes","body":"Pack Chat's role in any review/fix cycle is exactly: spawn pack-reviewer (in background) \u2192 read review report \u2192 triage findings (fix-or-skip per finding, with rationale for skips) \u2192 present triage to user \u2192 spawn fix-coder (in background) with the triage decisions \u2192 read the fix-coder IMPL-REPORT \u2192 stage + commit with user approval. Pack Chat does NOT use Edit / Write tools to apply review findings. NO threshold exception \u2014 there is no \"small enough to skip the coder\" carve-out. A one-line typo fix from a review finding goes to fix-coder. Rationale: auditability (fix-coder IMPL- REPORT carries","group":"Pack Chat scope","title":"Pack Chat does NO fixes."},{"anchor":"what-pack-chat-can-edit-directly","body":"(this is NOT a contradiction of the rule above \u2014 these are not fixes): - Memory files (`~/.claude/projects/\u003cslug>/memory/*.md`) \u2014 Pack Chat's own operating state, not pack work. - pack-chat-only files (the `/backlog/` + `/changelog/` trees / README version table / PACK-CHAT.md / PACK-AGENTS.md / trinity ops files at pack root / `project-template/` trinity) \u2014 see `PACK-AGENTS.md` \u00a7 \"Agent permission rules\" for the pack-chat-only list. pack-chat-only IS Pack-Chat-direct by construction. - Pack Chat may NOT edit project-template / supporting-docs / maintenance-docs / scripts / fixtures / agent de","group":"Pack Chat scope","title":"What Pack Chat CAN edit directly"},{"anchor":"pack-chat-minor-edits-only","body":"- **The small pack-chat-only set:** the `/backlog/` + `/changelog/` trees, the `README.md` version table, `PACK-CHAT.md`, `PACK-AGENTS.md`, the trinity `CLAUDE/AGENTS/GEMINI.md` (pack root + `project-template/`), `PACK-MEMORY-RATIONALE.md`, and the per-entry tree directories (`/backlog/`, `/changelog/`, `project-template/docs/project/ {backlog,implementation-plan,changelog}/`). - **Pack Chat may apply directly:** (a) bookkeeping tokens (a `Status:`/`Resolved:` state flip, a version bump, a dated note, a README version-table row, a CHANGELOG release-block append); (b) AUTHORING A NEW ENTRY \u2014 op","group":"Pack Chat scope","title":"Pack Chat does MINOR edits only; coder does every MAJOR edit and everything outside the small set."},{"anchor":"commit-approval-requests-include-next-steps-plan","body":"Every \"Approve commit?\" prompt to the user MUST include a numbered or bulleted list at the bottom of the approval message naming the concrete actions Pack Chat plans to take between this commit and the next anticipated commit. Each step names a concrete action (agent spawn + which agent; direct pack-chat-only edit + which file; test run; etc.) \u2014 not a vague phase name. If nothing is planned beyond this commit, explicitly state \"nothing planned.\" No exceptions for \"obvious\" next steps. Rationale: Pack Chat carries multi-step sequences in its head but the user only sees the immediate ask; surfac","group":"Pack Chat scope","title":"Commit-approval requests include next-steps plan."},{"anchor":"pack-architect-spawn-protocol","body":"When work touches rules, operating docs, memory files, PACK-CHAT.md, PACK-AGENTS.md, or any trinity Pack-memory section, spawn `pack-architect` FIRST to design a strategy doc; coder applies mechanically after user approves the strategy. Pack-architect spawn is NOT a Pack-Chat-direct decision \u2014 even when scope clearly calls for it, the architect-spawn requires explicit user approval. Rationale: an architect pass commits Pack Chat to a multi-stage pipeline (architect \u2192 planner \u2192 coder \u2192 reviewer) and reorders future BD work; that ordering decision belongs to the user. Pack-planner / pack-coder /","group":"Pack Chat scope","title":"Pack-architect spawn protocol."},{"anchor":"batch-scope-claims-are-enforced-by-ci-not-honor-","body":"When Pack Chat frames a batch as `pack-only`, `project-only`, or `pack-chat-only` in commit subjects, CI Check 36 verifies the commit diff matches the claimed scope. If a batch's work genuinely spans pack + project, the commit subject MUST NOT carry an exclusive scope keyword \u2014 use neutral framing (\"BD-NNN cross-surface work\") or explicitly split the batch into separate pack-side and project-side commits. Mis-framing a mixed-scope commit with a pack-only keyword is a CI failure, not a discipline note. The keyword vocabulary is defined in \u00a7 \"Rules for agents working on this repo\" \u2192 commit- subj","group":"Pack Chat scope","title":"Batch-scope claims are enforced by CI, not honor system."},{"anchor":"bounded-review-fix-cycle","body":"Pack Chat NEVER reviews coder output directly and does NO fixes itself; every coder run is followed by a BOUNDED review/fix cycle \u2014 maximum 2 review/fix pairs + 1 final reviewer pass = 3 reviewer / 2 fix-coder spawns per commit. If dirty after the final reviewer pass, STOP the cycle and spawn `pack-architect` to diagnose root cause + propose a path forward \u2014 no fix-coder pass 3 is allowed. ` `","group":"Pack Chat scope","title":"Pack Chat NO coder review; bounded reviewer/fix cycle."},{"anchor":"per-entry-trees-sole-ssot-pack-no-mirror","body":"The pack `/backlog/` and `/changelog/` per-entry trees (each with a generated `_toc.md` index) are the **SOLE source of truth and readable form** for pack entries. **There is no monolithic mirror**; do not recreate `pack-ops/BACKLOG.md` / `pack-ops/CHANGELOG.md`. The project streams (`docs/project/backlog/` / `implementation-plan/` / `changelog/`) are per-entry source of truth in flat-file mode; their monolithic `BACKLOG.md` / `IMPLEMENTATION-PLAN.md` / `CHANGELOG.md` files remain regenerated mirrors (read-stable but never source of truth) until BD-206 retires the project-side mirror. **Flat-f","group":"Repo conventions","title":"Per-entry trees \u2014 sole SSOT (pack: no mirror)."},{"anchor":"session-state-snapshot","body":"`pack-ops/session-state.json` is the committed, CLI-agnostic current-frontier snapshot \u2014 the SSOT for resumable in-flight state (active BDs + sub-step, in-flight agents to re-spawn, queue order, parallelization mode, pending decisions, in-commit cycle position, and the boundary commit). Pack Chat REPLACES its fields on every state transition; it is never appended-to with a dated note or a history line. CLI memory is FORBIDDEN for state. History goes to BD / changelog / commit / handoff, never the snapshot. `/pack-startup` reads it to resume. ` `","group":"Repo conventions","title":"Live session state lives in the committed snapshot, never CLI memory."},{"anchor":"memory-not-an-ssot","body":"NEVER put a pack- or project-related RULE in an out-of-repo CLI memory \u2014 the pack cannot version or control out-of-repo memory, so a cached rule copy goes stale silently and an actor acts on the wrong version with no traceable audit trail. Pack Chat and every agent SOURCE the pack + project rules from the live in-repo SSOT (trinity `## Pack memory` + `` bodies, `pack-ops/PACK-CHAT.md`, `pack-ops/PACK-AGENTS.md`, the `/backlog/` + `/changelog/` trees + `_rules.md`, `README.md`) and RE-READ the applicable rules from that SSOT at the START of every commit \u2014 never from a memory cache. Unsaved stat","group":"Repo conventions","title":"Memory is not an SSOT; the in-repo repo is."},{"anchor":"the-backlog-tree-has-no-resolved-section","body":"Entries resolve in place by flipping `Status: Open` to `Status: Resolved` and filling the `Resolved:` line. Do not propose moving entries to a separate section. Flip in the per-entry file (`/backlog/BD-NNN.md`) and regenerate `_toc.md` (flat-file is the sole supported mode). ``","group":"Repo conventions","title":"The `/backlog/` tree has no Resolved section."},{"anchor":"separate-pack-ops-from-pack-product","body":"Pack ops files (CLAUDE.md, AGENTS.md, GEMINI.md, PACK-CHAT.md, PACK-AGENTS.md, the `/backlog/` + `/changelog/` trees, etc.) are NEVER mixed into pack product files (`project-template/`, `supporting-docs/`). Same applies in reverse. ``","group":"Repo conventions","title":"Separate pack ops from pack product."},{"anchor":"pack-side-project-concepts-deliverable-only","body":"References to project-side concepts (TD entries, phases, phase parts, phase tasks) on pack-side surfaces MUST be limited to constructing project-side deliverables (templates, scripts that emit, validators that check); they MUST NOT appear in pack operations or pack-self-management templates/configs. ` `","group":"Repo conventions","title":"Project-side concepts on pack-side surfaces \u2014 deliverable-only."},{"anchor":"enumerate-encoding-surfaces","body":"When auditing or editing any pack-side surface for rule compliance, enumerate AND update in lock-step ALL surfaces that ENCODE its expected state \u2014 the surface itself, every validator + every TEST file that asserts its content invariants, every CI workflow referencing it, and cross-reference docs; asymmetric coverage (validators but not tests, or vice versa) creates audit gaps. ` `","group":"Repo conventions","title":"Enumerate ENCODING surfaces in pack-side audits."},{"anchor":"declare-verify-backing","body":"Any check that RECORDS a mapping (install row, wiring claim, surface\u2194surface link) MUST verify the LOAD-BEARING reality (the target ships / the wire is reachable / the matcher BITES), not merely a necessary-but-insufficient property (the target exists). ` `","group":"Repo conventions","title":"Records-style checks verify load-bearing backing."},{"anchor":"test-infra-is-self-provisioned","body":"Tests that need GitHub repos provision them via `gh` CLI with per-step approval and clean up after; never touch an existing real repo as a test target \u2014 use a scratch repo or a `/tmp` clone. ``","group":"Repo conventions","title":"Test infra is self-provisioned."},{"anchor":"skill-agent-maintenance-mechanical","body":"Keep skill/agent maintenance mechanical, complete, reviewed, and rule-strict, preserving the client `x-` contract; escalate any structural change \u2014 including a rule change or a broken `x-` contract \u2014 to architect-then-planner, never convenience. ` `","group":"Repo conventions","title":"Skill and agent maintenance is mechanical by default."},{"anchor":"pack-repo-code-comment-deferrals","body":"Code comments in pack-repo source (`scripts/`, `proto/`, any non-template source) that defer work MUST use the typed format defined in `project-template/CLAUDE.md` \u00a7 \"Deferral comments and BACKLOG hygiene\" \u2014 never plain English `// TODO`, `// fix later`, or `// FIXME` markers. Typed format: `// TODO(scope): TD-TBD \u2014 title`, `// KNOWN GAP(severity): TD-TBD \u2014 title`, `// VERIFY(source): TD-TBD \u2014 title` (substitute `#` for `//` in Python). ` `","group":"Repo conventions","title":"Pack-repo code-comment deferrals."},{"anchor":"filename-uniqueness-heuristic","body":"When introducing new files in the pack repo, prefer names that don't collide with any other file anywhere in the repo, so prose references are unambiguous even when the path is omitted (check `find . -name \"\u003cproposed-name>\" -not -path \"./.git/*\"` before naming); structurally required collisions (trinity, per-skill `SKILL.md`, ecosystem-fixed names) are exempt but their prose refs MUST carry path context. ` `","group":"Repo conventions","title":"Filename uniqueness heuristic."},{"anchor":"architect-doc-reality-reconciliation","body":"When a BD realizes a design anticipated in an architect doc, ship the reconciliation chain: (a) in-code docstring naming the realized consumer (file + symbol; never line numbers \u2014 line numbers drift), (b) architect-doc addendum cross-referencing the realized consumer, (c) IMPL-REPORT cross-reference linking both. ` `","group":"Repo conventions","title":"Architect-doc-vs-reality reconciliation."},{"anchor":"regenerate-manifest-v11-surface","body":"`test-fixtures/manifest.txt` is regenerated only at push, only when a fixture input changed, by `scripts/manifest-sync.sh` (run by the orchestrator before `git push`). Correctness is enforced by CI `build.sh --verify` + validate-pack Check 62 \u2014 do NOT regenerate the manifest per-commit. ` `","group":"Repo conventions","title":"Manifest is push-time, tool-enforced \u2014 not a per-commit chore."},{"anchor":"cross-cli-reference-normalization","body":"When editing references to per-CLI paths or commands in `project-template/{CLAUDE,AGENTS,GEMINI}.md`, substitute the audience-correct canonical value per `maintenance-docs/v11-implementation/ARCHITECTURE-BD-182.md` \u00a74.1 canonical reference table \u2014 NOT a byte-identical cross-trinity copy. ` `","group":"Repo conventions","title":"Cross-CLI reference normalization in `project-template/` trinity."},{"anchor":"dependency-direction-placement","body":"A file's location follows DEPENDENCY DIRECTION, not ship-status: a project-side deliverable must NEVER be a runtime dependency of a pack operation (the reverse is fine). Pack and project are SEPARATE surfaces; their behavior is MIRRORED but CUSTOMIZED per side \u2014 NO dual-use files/scripts, EVEN when the two copies would be byte-identical: ship a SEPARATE pack-side copy and a SEPARATE project-side copy, never one file serving both. A new client-shipped script defaults to `project-template/scripts/`; a file a pack operation depends on at runtime (e.g. `init-project.sh` `source`s it) stays pack-si","group":"Repo conventions","title":"Dependency-direction governs file location; pack and project stay SEPARATE (mirror-but-customize); the ship-allowlist goal is EMPTY."},{"anchor":"graph-first-context","body":"- **G1 existence guard.** When a graph exists, prefer it for orientation / relationship / blast-radius / \"what relates to X\" / \"where does Y live\" questions (a `graphify query` is read-only, deterministic, ~0 tokens) BEFORE broad tree reads; else use grep/Read (a fresh clone has no graph, so the rule degrades with zero friction). - **G2 fallback.** If a query errors or returns nothing useful, fall back to file reads \u2014 never block on the graph. - **Two phases \u2014 the second never vetoes the first.** - **(1) DISCOVERY / RECALL** (\"ALL surfaces related to X / where Y lives / blast radius of Z / wha","group":"Repo conventions","title":"Graph-first context when the knowledge graph exists."},{"anchor":"operating-docs-no-history-no-bloat","body":"An operating doc (a doc an agent/chat EXECUTES as live instruction \u2014 rules, agent/skill defs, prompts, write-contracts) carries (a) ZERO historical/audit-trail text (dated notes, `User-locked YYYY-MM-DD`, \"BD-NNN did X\" past-action narration, \"per BD-NNN\" / \"carried from\" provenance, incident/SHA refs); (b) ZERO description of a DEFERRED / unimplemented / off-by-default feature \u2014 even to say it is deferred (state only what currently exists and operates; the mention is re-added when the feature ships); and (c) is kept terse + structured (no mega-bullet run-ons, prose-that-should-be-a-table, or ","group":"Repo conventions","title":"Operating docs carry NO history, NO deferred-feature mentions; stay terse + structured."},{"anchor":"ci-check-runtime-compounding","body":"A validate-pack check runs many times per battery cycle, so author every check cheap-per-invocation \u2014 O(lines), no whole-tree filesystem walk, no subprocess-per-entry \u2014 and scope it to the caller's target tree (cost = per-run x invocation-count). ` `","group":"Repo conventions","title":"CI-check runtime compounding."},{"anchor":"fail-loud-delete-old-source","body":"On an SSOT migration DELETE the old source (no mirror) so dangling refs break loudly and get fixed; DELETE superseded docs entirely (no archive); the sole exception is an active doc with one stale element, reconciled in place. ` `","group":"Repo conventions","title":"Fail loud \u2014 delete the old source on migration."},{"anchor":"pack-entry-type-semantics","body":"Phases are never created with parts (parts are evolution-only); tasks are phase components; groupings contain phases only; the component hierarchy is fixed. ` `","group":"Repo conventions","title":"Pack entry-type data-structure semantics."},{"anchor":"public-bound-no-leak","body":"The pack ships and is read publicly; the target project's name and its domain-specific vocabulary (the exact token set enumerated in `no_leak.py`'s config) MUST NOT appear on any client/public surface \u2014 `project-template/`, `supporting-docs/`, `.github/`, the repo-root `README.md`, and the pack-root trinity. Internal dev-history surfaces (`backlog/`, `changelog/`, `maintenance-docs/`, `test-fixtures/`) keep their internal shorthand per the two-tier keep-list. Enforcement is validate-pack Check 93 (`scripts/lib/validate_checks/no_leak.py`): leg 1 bans the literal name tree-wide; leg 2 bans the ","group":"Repo conventions","title":"The pack is public-bound \u2014 never leak the target project's name or its domain vocabulary onto a client/public surface."}],"version":"11.0","wave":"Onboarding-UX program (user: turnkey-it-all-in-v11.0). DONE: BD-287 (migrator auto-merge) + BD-285 (fresh-install collision C1 + guided keep/replace/merge C2, folded to a UNIVERSAL 2-way onboarding merge via the resolve-merge-conflicts skill). NEXT: BD-172 Gate-2 rebase -> BD-093 release pin -> launch."}</script>

 const g=[];
 g.push(`<div class="brand">&#9670; Pack frontier<span class="v">v${E(S.version||'?')}${S.qualifier?' &#183; '+E(S.qualifier):''}</span></div>`);
 g.push(`<div class="navgroup"><h4>Frontier</h4>
  <a href="#landing" data-r="landing">Landing</a>
  <a href="#frontier" data-r="frontier">Frontier</a>
  <a href="#grand-plan" data-r="grand-plan">Grand plan</a></div>`);
 const mo=(S.motion||[]);const act=new Set(S.active||[]);
 g.push(`<div class="navgroup"><h4>Work items &#183; ${mo.length}</h4>`+
  mo.map(id=>{const r=bd(id);const st=act.has(id)?'active':r.status;
   return `<a href="${idHash(id)}" data-r="${id.toLowerCase()}">${dot(st)}<span>${E(id)}</span>${act.has(id)?'<span class="chip here">here</span>':''}</a>`;}).join('')+`</div>`);
 g.push(`<div class="navgroup"><h4>Reference</h4>
  <a href="#archive" data-r="archive">Archive &#183; All BDs</a>
  <a href="#methodology" data-r="methodology">Methodology</a>
  <a href="#rules" data-r="rules">Pack rules</a>
  <a href="#deps" data-r="deps">Dependencies</a>
  <a href="#changelog" data-r="changelog">Recently landed</a>
  <a href="#metrics" data-r="metrics">Metrics</a>
  <a href="#help" data-r="help">Help &amp; commands</a></div>`);
 return g.join('');
}

/* ---------- pages ---------- */
function pLanding(){
 const c=S.counts||{},m=S.metrics||{};
 return `<div class="eyebrow">Optiquity AI Agent Config Pack</div><h1>Landing</h1>
 <p class="lede">A live, at-a-glance mirror of pack work &#8212; what is in motion, everything in play, and each backlog item's pipeline.</p>
 <div class="grid" style="margin-top:14px">
  <div class="tile"><div class="k">Version</div><div class="v">v${E(S.version||'?')}</div><div class="s">${E(S.qualifier||'')} &#183; ${E(S.date||'')}</div></div>
  <div class="tile"><div class="k">Open items</div><div class="v">${c.open||0}</div><div class="s">of ${c.total||0} total</div></div>
  <div class="tile"><div class="k">Resolved</div><div class="v">${m.resolved||0}</div><div class="s">${m.pct||0}% of total</div></div>
  <div class="tile"><div class="k">Boundary</div><div class="v mono">${E((S.boundary||'&#8212;'))}</div><div class="s">${S.boundaryFresh?'&#10003; fresh':'&#8634; behind'}</div></div>
 </div>
 <div class="grid" style="margin-top:6px">
  ${['frontier|Frontier|the running window + in-flight view','grand-plan|Grand plan|everything in play',
     'archive|Archive|the permanent BD index','methodology|Methodology|how work moves',
     'rules|Pack rules|standing rules','help|Help &amp; commands|pack-side commands',
     'metrics|Metrics|toward launch'].map(x=>{const[r,t,d]=x.split('|');
     return `<a class="tile" href="#${r}"><div class="v" style="font-size:1.05rem">${t}</div><div class="s">${d}</div></a>`;}).join('')}
 </div>
 <h2>Where we are now</h2>${sessionBand()}
 <div class="card"><strong>In flight now</strong>${
  (S.active||[]).length?(S.active||[]).map(id=>{const r=bd(id);
   return `<div class="row"><div class="main"><a class="ttl" href="${idHash(id)}">${E(id)} &#8212; ${E(r.title)}</a> ${pill('active')} ${S.inflight&&S.inflight.dirty?'<span class="chip live">editing now</span>':'<span class="chip">idle</span>'}</div></div>`;}).join('')
   :'<div class="muted">No active items.</div>'}</div>
 <div class="card"><strong>Recently resolved</strong>${recentResolved(5)}</div>
 <div class="disc">Never a source of truth; snapshot at boundary ${E(S.boundary||'&#8212;')}; republished on change.</div>`;

function sessionBand(){
 const p=S.parallelization||{};
 const agents=S.agentsRunning||[];
 return `<div class="card">
  <div class="kv">
   <div class="k">Active BDs</div><div>${(S.active||[]).length?(S.active||[]).map(id=>`<a href="${idHash(id)}">${E(id)}</a>`).join(', ')+' '+pill('active'):'<span class="muted">none</span>'}</div>
   <div class="k">Running agents</div><div>${agents.length?agents.map(a=>`<span class="chip">${E(a.role)}</span> ${E(a.name)}`).join('<br>'):'No agents running.'}</div>
   <div class="k">Cycle position</div><div>${has(S.cyclePosition)?E(S.cyclePosition):'<span class="muted">&#8212;</span>'}</div>
   <div class="k">Parallelization</div><div><strong>${E(p.mode||'idle')}</strong>${p.note?' &#8212; '+E(p.note):''}</div>
   <div class="k">Wave</div><div>${has(S.wave)?E(S.wave):'<span class="muted">&#8212;</span>'}</div>
   <div class="k">Boundary commit</div><div><span class="mono">${E(S.boundary||'&#8212;')}</span> ${S.boundaryFresh?'<span class="chip fresh">&#10003; fresh</span>':'<span class="chip behind">&#8634; behind</span>'}</div>
  </div></div>`;
}

function pFrontier(){
 const inf=S.inflight||{};const mo=S.motion||[];const act=new Set(S.active||[]);
 let h=`<div class="eyebrow">In motion &#183; ${mo.length}</div><h1>Frontier ${inf.dirty?'<span class="chip live">editing now</span>':''}</h1>
 <p class="lede">The merged running-window + in-flight view.</p>
 <h2>Live session-state band</h2>${sessionBand()}
 <h2>Running window</h2><div class="card">`;
 h+=mo.length?mo.map((id,i)=>{const r=bd(id);const st=act.has(id)?'active':r.status;
   return `<div class="row"><div class="idx">${i+1}</div><div class="main">
    <a class="ttl" href="${idHash(id)}">${E(id)} &#8212; ${E(r.title)}</a> ${act.has(id)?'<span class="chip here">you are here</span>':''} ${inf.dirty&&act.has(id)?'<span class="chip live">in progress</span>':''}
    <div class="note">${E((r.type||'').slice(0,90))}</div></div><div>${pill(st)}</div></div>`;}).join(''):'<div class="muted">Window empty.</div>';
 h+='</div>';
 const wt=inf.worktrees||{};
 h+=`<h2>In-flight worktrees</h2><div class="card"><div class="kv">
  <div class="k">Linked worktrees</div><div>${wt.all||0} total &#183; ${(wt.scoped||[]).length} in-scope</div>
  <div class="k">Main tree</div><div>${inf.dirty?'<span class="chip live">dirty &#183; '+(inf.files||[]).length+' files</span>':'clean'}</div></div>`;
 h+=(wt.scoped||[]).map(w=>`<div class="row"><div class="main"><span class="mono">${E(w.branch||'')}</span></div><div>${pill('active')}</div></div>`).join('')||'<div class="muted" style="margin-top:6px">No in-scope linked worktrees.</div>';
 h+='</div>';
 const ag=S.agentsRunning||[];
 h+=`<h2>Running agents</h2><div class="card">${ag.length?ag.map(a=>`<div class="row"><div class="main"><span class="chip">${E(a.role)}</span> <span class="mono">${E(a.name)}</span></div></div>`).join(''):'<div class="muted">No agents running.</div>'}</div>`;
 h+=`<h2>Decisions &amp; directives</h2><div class="card">${(S.pendingDecisions||[]).length?(S.pendingDecisions||[]).map(d=>`<div class="row"><div class="main">${E(d)}</div></div>`).join(''):'<div class="muted">None on record.</div>'}</div>`;
 h+=`<div class="disc">Mirrors pack-ops/session-state.json.</div>`;
 return h;
}

function pGrand(){
 const p=S.parallelization||{};const plans=S.plans||{};const mo=S.motion||[];
 const planned=mo.filter(id=>plans[id]);const awaiting=mo.filter(id=>!plans[id]);
 let h=`<div class="eyebrow">Everything in play &#183; ${E(p.mode||'idle')}</div><h1>Grand plan</h1>
 <div class="card"><strong>Sequencing:</strong> <strong>${E(p.mode||'idle')}</strong>${p.note?' &#8212; '+E(p.note):''}</div>
 <h2>Planned &#183; ${planned.length}</h2>`;
 h+=planned.map(id=>{const r=bd(id),pl=plans[id];const pr=pl.progress||{};
  return `<div class="card"><a class="ttl" href="${idHash(id)}">${E(id)} &#8212; ${E(r.title)}</a> ${pill(S.active.includes(id)?'active':r.status)} <span class="chip">${E(pl.sizeTier||'')}</span>
   ${bar(pr.done||0,pr.total||0)}
   <div class="sec">${(pl.evidence||[]).slice(0,8).map(ev=>`<div class="step"><span class="box done">&#10003;</span><span><span class="mono chip">${E(ev.sha)}</span> ${E(ev.subject)}</span></div>`).join('')}</div></div>`;}).join('')||'<div class="muted">No planned cards.</div>';
 h+=`<h2>Awaiting planning &#183; ${awaiting.length}</h2><div class="card">${awaiting.map(id=>{const r=bd(id);return `<div class="row"><div class="main"><a href="${idHash(id)}">${E(id)} &#8212; ${E(r.title)}</a></div><div>${pill(S.active.includes(id)?'active':r.status)}</div></div>`;}).join('')||'<div class="muted">None.</div>'}</div>
 <div class="disc">Reflects the snapshot; the full index lives on the Archive.</div>`;
 return h;
}

const GROUPS=[['active','Active'],['pending','Open'],['unblocked','Unblocked'],['deferred','Deferred'],['done','Resolved'],['deprecated','Deprecated'],['cancelled','Cancelled']];
function pArchive(){
 const all=Object.values(S.bds||{});
 let h=`<div class="eyebrow">Permanent index &#183; ${all.length} items</div><h1>Archive &#183; All BDs</h1>
 <div class="card"><strong>Recently resolved</strong>${recentResolved(5)}</div>
 <input class="filter" id="flt" placeholder="Filter by id or title&#8230;" oninput="ARCH_FILTER(this.value)">
 <div id="arch">`;
 for(const[st,lab] of GROUPS){
  const rows=all.filter(r=>r.status===st).sort(
   st==='done'
    ? (a,b)=>(b.resolved_date||'').localeCompare(a.resolved_date||'')||b.num-a.num
    : (a,b)=>b.num-a.num);
  if(!rows.length)continue;
  h+=`<h2>${lab} &#183; ${rows.length}</h2><div class="card">`+rows.map(r=>
   `<div class="row af" data-f="${E((r.id+' '+r.title).toLowerCase())}"><div class="main">
    <a class="ttl" href="${idHash(r.id)}">${E(r.id)} &#8212; ${E(r.title)}</a> ${r.tier==='full'&&(S.plans||{})[r.id]?'<span class="chip">deep</span>':''} ${(S.active||[]).includes(r.id)?'<span class="chip here">here</span>':''}
    <div class="note">${E(r.snippet||'')}</div></div><div>${pill(r.status)}</div></div>`).join('')+`</div>`;
 }
 h+='</div>';return h;
}
window.ARCH_FILTER=v=>{v=(v||'').toLowerCase();document.querySelectorAll('#arch .af').forEach(el=>{el.style.display=el.dataset.f.indexOf(v)>-1?'':'none';});};

function recentResolved(n){
 const rs=Object.values(S.bds||{}).filter(r=>r.status==='done').sort((a,b)=>(b.resolved_date||'').localeCompare(a.resolved_date||'')||b.num-a.num).slice(0,n);
 return rs.length?rs.map(r=>`<div class="row"><div class="main"><a href="${idHash(r.id)}">${E(r.id)} &#8212; ${E(r.title)}</a></div><div>${pill('done')}</div></div>`).join(''):'<div class="muted">None.</div>';
}

function pBD(id){
 const r=bd(id);const pl=(S.plans||{})[id];const isAct=(S.active||[]).includes(id);
 const st=isAct?'active':r.status;
 const dec=(S.pendingDecisions||[]).filter(d=>d.indexOf(id)>-1||d.indexOf(id.replace('BD-0','BD-'))>-1);
 let h=`<div class="eyebrow"><a href="#archive">Archive</a> &#8250; ${E(id)} &#183; ${LBL[st]?LBL[st][0]:st}</div><h1>${E(r.title)}</h1>`;
 if(r.type)h+=`<p class="lede">${E(r.type)}</p>`;
 if(pl){const pr=pl.progress||{};
  h+=`<div class="card"><div class="grid">
   <div class="tile"><div class="k">Status</div><div class="v" style="font-size:1rem">${pill(st)}</div></div>
   <div class="tile"><div class="k">Commits landed</div><div class="v">${(pl.evidence||[]).length}</div></div>
   <div class="tile"><div class="k">Size</div><div class="v" style="font-size:1rem">${E(pl.sizeTier||'')}</div></div>
  </div>${bar(pr.done||0,pr.total||0)}</div>
  <h2>Waves &amp; commits</h2><div class="card">${(pl.evidence||[]).map(ev=>`<div class="step"><span class="box done">&#10003;</span><span><span class="mono chip">${E(ev.sha)}</span> ${E(ev.subject)}</span></div>`).join('')||'<div class="muted">No landed commits yet.</div>'}</div>`;
 }else{
  h+=`<h2>Where we are</h2><div class="card"><div class="kv">
   <div class="k">Type</div><div>${E(r.type||'&#8212;')}</div>
   <div class="k">Target</div><div>${E(r.target||'&#8212;')}</div>
   <div class="k">Blockers</div><div>${E(r.blockers||'&#8212;')}</div>
   <div class="k">Unblocks</div><div>${E(r.unblocks||'&#8212;')}</div></div></div>`;
 }
 if(r.body)h+=`<h2>Detail</h2><div class="card">${E(r.body)}</div>`;
 else if(r.snippet)h+=`<div class="card">${E(r.snippet)}</div>`;
 h+=`<h2>Decisions on record</h2><div class="card">${dec.length?dec.map(d=>`<div class="row"><div class="main">${E(d)}</div></div>`).join(''):'<div class="muted">None touching this BD.</div>'}</div>`;
 return h;
}

function pMethodology(){
 let h=`<div class="eyebrow">How work moves</div><h1>Methodology</h1>
 <div class="card"><strong>Large-BD deterministic flow</strong><div class="muted">docs-researcher &#8594; architect &#8594; adversarial architect &#8594; reconciliation (if findings) &#8594; user design review &#8594; planner &#8594; adversarial planner &#8594; reconciliation (if findings) &#8594; user gate &#8594; parallel worktree coder waves.</div></div>
 <div class="card"><strong>Small-BD flow</strong><div class="muted">(optional researcher) &#8594; architect &#8594; planner &#8594; coder + bounded review/fix cycle.</div></div>
 <h2>Agent roster</h2><div class="card">`;
 h+=(S.agents||[]).map(a=>`<div class="row"><div class="main"><span class="mono">${E(a.name)}</span> ${a.cls==='RW'?'<span class="pill accent">RW</span>':'<span class="pill pending">RO</span>'}<div class="note">${E(a.role)}</div></div></div>`).join('')||'<div class="muted">No roster.</div>';
 h+='</div>';return h;
}

function pRules(){
 const rs=S.rules||[];const groups={};rs.forEach(r=>{(groups[r.group]=groups[r.group]||[]).push(r);});
 let h=`<div class="eyebrow">Standing rules &#183; ${rs.length}</div><h1>Pack rules</h1><p class="lede">A live mirror of CLAUDE.md &#167; Pack memory.</p>`;
 for(const g in groups){h+=`<h2>${E(g)}</h2>`+groups[g].map(r=>
  `<div class="card" id="rules-${E(r.anchor)}"><strong>${E(r.title)}</strong>${r.anchor?` <span class="chip">${E(r.anchor)}</span>`:''}<div class="muted" style="margin-top:5px">${E(r.body)}</div></div>`).join('');}
 return h;
}

function pDeps(){
 const act=new Set(S.active||[]);const edges=[];
 (Object.values(S.bds||{})).forEach(r=>{if(!r.blockers)return;const low=r.blockers.toLowerCase();
  if(/no blocker|none|n\/a/.test(low))return;
  const tos=(r.blockers.match(/BD-\d+/g)||[]).filter(t=>t!==r.id);
  if(tos.length)edges.push({from:r.id,num:r.num,to:[...new Set(tos)],why:r.blockers,st:act.has(r.id)?'active':r.status});});
 let h=`<div class="eyebrow">Sequencing</div><h1>Dependencies</h1><p class="lede">Best-effort from each BD's Blockers: prose.</p>`;
 if(!edges.length)return h+'<div class="card muted">No prerequisite edges parsed from Blockers prose.</div>';
 const SECTIONS=[['Open &amp; queued',['pending','unblocked','deferred','active']],
  ['Resolved',['done']],
  ['Deprecated &amp; superseded',['deprecated','cancelled']]];
 SECTIONS.forEach(sec=>{const label=sec[0],toks=sec[1];
  const rows=edges.filter(e=>toks.indexOf(e.st)>-1).sort((a,b)=>a.num-b.num||(a.from<b.from?-1:a.from>b.from?1:0));
  if(!rows.length)return;
  h+=`<h2>${label} &#183; ${rows.length}</h2>`;
  h+=rows.map(e=>`<div class="card"><a class="ttl" href="${idHash(e.from)}">${E(e.from)}</a> ${pill(e.st)} <span class="muted">waits on</span> ${e.to.map(t=>`<a href="${idHash(t)}">${E(t)}</a>`).join(', ')}<div class="note">${E(e.why.slice(0,200))}</div></div>`).join('');});
 return h;
}

function pChangelog(){
 let h=`<div class="eyebrow">Newest first</div><h1>Recently landed</h1>`;
 h+=(S.changelog||[]).map(c=>`<div class="card"><strong>${E(c.version)}</strong> <span class="chip">${E(c.date)}</span>
  <div class="sec">${(c.items||[]).map(it=>`<div class="step"><span class="box done">&#10003;</span><span>${E(it)}</span></div>`).join('')||'<div class="muted">&#8212;</div>'}</div></div>`).join('');
 return h;
}

 const c=S.counts||{},m=S.metrics||{};

 <div class="card"><strong>Resolution progress</strong>${bar(m.resolved||0,m.total||0)}
  <div class="kv" style="margin-top:8px"><div class="k">Open / unblocked</div><div>${(c.open||0)+(c.unblocked||0)}</div>
  <div class="k">Deferred</div><div>${c.deferred||0}</div>
  <div class="k">Running window</div><div>${(S.motion||[]).length}</div></div></div>
 <div class="card"><strong>Repo context</strong><div class="kv" style="margin-top:6px">
  <div class="k">Total items</div><div>${c.total||0}</div>
  <div class="k">Running window</div><div>${(S.motion||[]).length}</div>
  <div class="k">Branch</div><div class="mono">${E((S.repo&&S.repo.branch||'').replace(/^worktree-agent-.*/,'&#8212;'))}</div></div></div>`;

function pHelp(){
 const cmds=(S.help&&S.help.commands)||[];
 let h=`<div class="eyebrow">Pack-side commands</div><h1>Help &amp; commands</h1>
 <div class="card"><strong>Pack commands</strong><div class="sec">${cmds.map(c=>`<div class="step"><span class="box">&#183;</span><span class="mono">${E(c)}</span></div>`).join('')||'<div class="muted">&#8212;</div>'}</div></div>
 <div class="proj"><h3>Project-side &#8212; not pack commands</h3><div class="muted">Client project command surfaces are separate from pack-self commands (see BD-257).</div></div>`;
 return h;
}

/* ---------- router ---------- */
function route(){
 const raw=(location.hash||'#landing').slice(1);
 const[seg,anchor]=raw.split('/');
 let html;
 if(/^bd-\d+$/.test(seg)){html=pBD('BD-'+seg.split('-')[1].padStart(3,'0'));}
 else switch(seg){
  case'':case'landing':html=pLanding();break;
  case'frontier':html=pFrontier();break;
  case'grand-plan':html=pGrand();break;
  case'archive':html=pArchive();break;
  case'methodology':html=pMethodology();break;
  case'rules':html=pRules();break;
  case'deps':html=pDeps();break;
  case'changelog':html=pChangelog();break;
  case'metrics':html=pMetrics();break;
  case'help':html=pHelp();break;
  default:html=pLanding();
 }
 document.getElementById('main').innerHTML=html;
 document.querySelectorAll('.navgroup a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+seg));
 window.scrollTo(0,0);
 if(anchor){const el=document.getElementById(seg+'-'+anchor)||document.getElementById(anchor);if(el)el.scrollIntoView();}
 document.body.classList.remove('nav-open');
}
document.getElementById('side').innerHTML=sidebar();
window.addEventListener('hashchange',route);
route();
</script>
