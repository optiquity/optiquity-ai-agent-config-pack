# buf.yaml — Protobuf schema management configuration
# https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Remove this exception if your package names use version suffixes (e.g. com.example.v1)
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
