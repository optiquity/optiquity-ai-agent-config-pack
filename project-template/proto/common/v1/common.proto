syntax = "proto3";

// Shared message types used across all services.
// Import this file in service .proto files:
//   import "common/v1/common.proto";
package common.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/rpc/status.proto";

option swift_prefix = "";

// PageRequest encapsulates cursor-based pagination parameters.
// Use in list RPC request messages.
message PageRequest {
  // Maximum number of results to return. Server may return fewer.
  // Clients should handle a smaller result set than requested.
  int32 page_size = 1;

  // Opaque token from a previous response's next_page_token.
  // Leave empty to request the first page.
  string page_token = 2;
}

// PageResponse encapsulates cursor-based pagination output.
// Embed in list RPC response messages.
message PageResponse {
  // Token for the next page. Empty when there are no more results.
  string next_page_token = 1;

  // Estimated total count of items. May be 0 if server does not compute this.
  int32 total_count = 2;
}

// AuditInfo carries creation and modification metadata.
// Embed in resource messages that need audit trails.
message AuditInfo {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  string created_by = 3;
  string updated_by = 4;
}
