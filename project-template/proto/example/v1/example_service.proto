syntax = "proto3";

// Example gRPC service definition.
// Replace this with your actual service. See common/v1/common.proto for shared types.
package example.v1;

import "common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option swift_prefix = "";

// ── Messages ────────────────────────────────────────────────────

message Item {
  string id = 1;
  string name = 2;
  ItemStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Every proto3 enum must have a zero-value UNSPECIFIED case.
enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_ACTIVE = 1;
  ITEM_STATUS_ARCHIVED = 2;
}

message CreateItemRequest {
  string name = 1;
}

message GetItemRequest {
  string id = 1;
}

message UpdateItemRequest {
  Item item = 1;
  // FieldMask specifies which fields to update.
  // Server applies only the named fields; omitted fields are unchanged.
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteItemRequest {
  string id = 1;
}

message ListItemsRequest {
  common.v1.PageRequest page = 1;
  // Optional status filter. Leave UNSPECIFIED to return all statuses.
  optional ItemStatus status_filter = 2;
}

message ListItemsResponse {
  repeated Item items = 1;
  common.v1.PageResponse page = 2;
}

// ── Service ─────────────────────────────────────────────────────

// ExampleService demonstrates common CRUD + streaming patterns.
// Replace or extend this with your actual service definition.
service ExampleService {
  // Unary RPCs — CRUD operations
  rpc CreateItem(CreateItemRequest) returns (Item);
  rpc GetItem(GetItemRequest) returns (Item);
  rpc UpdateItem(UpdateItemRequest) returns (Item);
  rpc DeleteItem(DeleteItemRequest) returns (google.protobuf.Empty);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  // Server-streaming — use for live feeds, real-time updates, large result sets
  rpc WatchItem(GetItemRequest) returns (stream Item);
}
